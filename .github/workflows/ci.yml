# Continuous Integration
# Runs on every push and pull request
# Builds all projects and runs tests to ensure code quality

name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'samples/**'
      - 'assets/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'samples/**'
      - 'assets/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel previous runs on the same branch / PR when a new commit comes in
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build Spectara.Revela.slnx --no-restore -c Release

      - name: Verify formatting
        env:
          Configuration: Release
        run: dotnet format Spectara.Revela.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Run Tests
        run: dotnet test --solution Spectara.Revela.slnx --no-build -c Release --report-trx --results-directory ./TestResults --coverage --coverage-settings coverage.config --coverage-output-format cobertura

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            ./TestResults/**/*.trx
            ./TestResults/**/*.cobertura.xml
