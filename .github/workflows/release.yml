# Release Pipeline
# Triggered by pushing a version tag (v0.0.1, v1.0.0, etc.)
#
# Pipeline stages:
#   validate → packages → build → sign → release → website
#
# "Build once, ship the artifact" — packages are built once in the
# packages stage and reused for signing and GitHub Release downloads.
#
# NuGet.org publication is not configured in this workflow.
#
# Release contents:
# - Standalone: CLI executable with all plugins/themes statically linked
# - Full:       CLI executable + all plugins/themes as bundled NuGet packages
# - Core:       CLI executable only (downloads plugins from NuGet.org)
# - NuGet packages: CLI tool, SDK, plugins, themes

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (without v prefix, e.g. 0.0.1)'
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Validate version tag
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release version
        id: version
        shell: pwsh
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: ./scripts/validate-release-version.ps1

  # Build plugins and themes as NuGet packages (platform-independent, runs first)
  packages:
    name: Build Packages (NuGet)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Restore
        run: dotnet restore

      # Standard 3-step pipeline (build → test → pack) per Microsoft's
      # GitHub Actions guidance. `IsPackable` is set per-project in csproj
      # (default false in Directory.Build.props, true on the 14 published
      # projects), so `dotnet pack` against the solution emits exactly the
      # right packages.
      #
      # `DebugType=embedded` keeps symbol info inside each DLL (no separate
      # .pdb files). This stabilises the build output across the later
      # `dotnet publish` calls (which would otherwise strip PDBs and break
      # `dotnet pack --no-build` with NU5026), and stack traces from the
      # released binaries still show file/line numbers.
      - name: Build
        run: dotnet build Spectara.Revela.slnx -c Release --no-restore -p:Version=${{ env.VERSION }} -p:DebugType=embedded

      - name: Test
        run: dotnet test --solution Spectara.Revela.slnx -c Release --no-build --no-restore

      - name: Pack
        # `--no-build`: pack the EXACT binaries that the Test step verified —
        # never publish untested artefacts. `IncludeSymbols=false` is what
        # actually unblocked NU5017 on hosted runners; pre-NU5017-fix runs
        # showed the bogus second pack target only when .snupkg generation
        # was active (the CI default). DebugType=embedded keeps stack-trace
        # fidelity inside each DLL, so dropping .snupkg loses nothing.
        run: dotnet pack Spectara.Revela.slnx -c Release --no-build --no-restore -o ./nupkgs -p:PackageVersion=${{ env.VERSION }} -p:Version=${{ env.VERSION }} -p:DebugType=embedded -p:IncludeSymbols=false

      - name: List NuGet packages
        run: ls -lh ./nupkgs/

      - name: Verify packaged SDK consumer
        shell: pwsh
        run: ./scripts/test-sdk-consumer.ps1 -PackageDirectory ./nupkgs -Version $env:VERSION

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ./nupkgs/*.nupkg

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: ./nupkgs/*.nupkg
          retention-days: 1

  # Build native executables for each platform (Core + Full variants)
  build:
    name: Build ${{ matrix.rid }}
    needs: [validate, packages]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: revela.exe
          # Native arm64 Windows runner (GA 2025) — covers Copilot+ PCs and
          # Snapdragon X devices. NetVips.Native.win-arm64 ships the libvips
          # bundle for this RID, so the standalone variant works out of the box.
          - os: windows-11-arm
            rid: win-arm64
            exe: revela.exe
          - os: ubuntu-latest
            rid: linux-x64
            exe: revela
          # Native arm64 Linux runner (GA since 2025) — avoids the
          # gcc-aarch64-linux-gnu cross-toolchain dance Native AOT would
          # otherwise need from an x64 host.
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            exe: revela
          - os: macos-latest
            rid: osx-arm64
            exe: revela

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Publish CLI
        shell: bash
        run: |
          dotnet publish src/Cli/Cli.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=embedded \
            -p:Version=${{ needs.validate.outputs.version }} \
            -o ./publish

      - name: Clean up XML docs
        run: rm -f ./publish/*.xml
        shell: bash

      - name: Copy launcher script (Linux/macOS)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        run: |
          # Copy launcher script that sets CWD to script directory
          # This fixes double-click behavior on macOS/Linux where CWD defaults to HOME
          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            cp scripts/launchers/start-revela.command "./publish/Start Revela.command"
            chmod +x "./publish/Start Revela.command"
            echo "✅ Copied 'Start Revela.command' for macOS"
          else
            cp scripts/launchers/start-revela.sh ./publish/start-revela.sh
            chmod +x ./publish/start-revela.sh
            echo "✅ Copied 'start-revela.sh' for Linux"
          fi
        shell: bash

      - name: List publish output
        run: ls -la ./publish/
        shell: bash

      # === Core Release ===
      - name: Package Core (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        run: |
          cd publish
          Compress-Archive -Path ${{ matrix.exe }} -DestinationPath ../revela-${{ matrix.rid }}-core.zip
        shell: pwsh

      - name: Package Core (Linux/macOS)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        run: |
          cd publish
          chmod +x ${{ matrix.exe }}
          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            tar -czvf ../revela-${{ matrix.rid }}-core.tar.gz ${{ matrix.exe }} "Start Revela.command"
          else
            tar -czvf ../revela-${{ matrix.rid }}-core.tar.gz ${{ matrix.exe }} start-revela.sh
          fi

      # === Full Release ===
      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: ./publish/packages

      - name: List packages for Full release
        run: ls -la ./publish/packages/
        shell: bash

      - name: Package Full (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        run: |
          cd publish
          Compress-Archive -Path ${{ matrix.exe }}, packages -DestinationPath ../revela-${{ matrix.rid }}-full.zip
        shell: pwsh

      - name: Package Full (Linux/macOS)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        run: |
          cd publish
          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            tar -czvf ../revela-${{ matrix.rid }}-full.tar.gz ${{ matrix.exe }} "Start Revela.command" packages
          else
            tar -czvf ../revela-${{ matrix.rid }}-full.tar.gz ${{ matrix.exe }} start-revela.sh packages
          fi

      # === Standalone Release (Cli.Embedded) ===
      # Native AOT — all plugins/themes statically linked, all managed code
      # AOT-compiled into a single native executable. No NuGet plugin
      # management, no JIT, no .NET runtime bundled (the AOT binary IS the
      # runtime). The NetVips native library (libvips.so.42 / libvips-42.dll
      # / libvips.42.dylib) ships alongside as a separate file (NetVips loads
      # it via P/Invoke — cannot be bundled into the AOT binary).
      # Cli.Embedded.csproj has <PublishAot>true</PublishAot> unconditional;
      # every hosted runner has its native toolchain pre-installed.
      - name: Publish Cli.Embedded (Standalone — Native AOT)
        shell: bash
        run: |
          dotnet publish src/Cli.Embedded/Cli.Embedded.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:StripSymbols=true \
            -p:Version=${{ needs.validate.outputs.version }} \
            -o ./publish-standalone

      - name: Copy launcher script - Standalone (Linux/macOS)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        run: |
          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            cp scripts/launchers/start-revela.command "./publish-standalone/Start Revela.command"
            chmod +x "./publish-standalone/Start Revela.command"
          else
            cp scripts/launchers/start-revela.sh ./publish-standalone/start-revela.sh
            chmod +x ./publish-standalone/start-revela.sh
          fi
        shell: bash

      # Strip XML doc files + per-platform debug companions left over from
      # AOT publish (managed .pdb stubs, Linux .dbg, macOS .dwarf, Windows
      # native .pdb — the *.pdb sweep covers managed + Windows native).
      - name: Clean up AOT debug artefacts (Standalone)
        shell: bash
        run: |
          rm -f ./publish-standalone/*.xml \
                ./publish-standalone/*.pdb \
                ./publish-standalone/*.dbg \
                ./publish-standalone/*.dwarf

      - name: Package Standalone (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        run: |
          cd publish-standalone
          # Include the libvips-42.dll native dependency alongside the AOT exe
          Compress-Archive -Path ${{ matrix.exe }}, libvips-42.dll -DestinationPath ../revela-${{ matrix.rid }}-standalone.zip
        shell: pwsh

      - name: Package Standalone (Linux/macOS)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        run: |
          cd publish-standalone
          chmod +x ${{ matrix.exe }}
          # Include the libvips native dependency alongside the AOT binary
          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            tar -czvf ../revela-${{ matrix.rid }}-standalone.tar.gz ${{ matrix.exe }} libvips.42.dylib "Start Revela.command"
          else
            tar -czvf ../revela-${{ matrix.rid }}-standalone.tar.gz ${{ matrix.exe }} libvips.so.42 start-revela.sh
          fi

      # === Attestation & Upload ===
      - name: Verify final release archives
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_RID: ${{ matrix.rid }}
        run: |
          $extension = if ($env:RELEASE_RID.StartsWith('win-')) { 'zip' } else { 'tar.gz' }
          foreach ($variant in @('Core', 'Full', 'Standalone')) {
            $arguments = @{
              ArtifactPath = "./revela-$env:RELEASE_RID-$($variant.ToLowerInvariant()).$extension"
              Variant = $variant
              Version = $env:RELEASE_VERSION
              RuntimeIdentifier = $env:RELEASE_RID
            }
            if ($variant -eq 'Core') { $arguments.PackageDirectory = './publish/packages' }
            ./scripts/test-release.ps1 @arguments
          }

      - name: Upload artifact test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artifact-tests-${{ matrix.rid }}
          path: |
            artifacts/release-test-*/**/*.log
            artifacts/release-test-*/**/*hashes*.json
            artifacts/sdk-consumer-*/*.log
          if-no-files-found: warn

      - name: Attest Core build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: revela-${{ matrix.rid }}-core.*

      - name: Attest Full build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: revela-${{ matrix.rid }}-full.*

      - name: Attest Standalone build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: revela-${{ matrix.rid }}-standalone.*

      - name: Upload Core artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}-core
          path: revela-${{ matrix.rid }}-core.*
          retention-days: 1

      - name: Upload Full artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}-full
          path: revela-${{ matrix.rid }}-full.*
          retention-days: 1

      - name: Upload Standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}-standalone
          path: revela-${{ matrix.rid }}-standalone.*
          retention-days: 1

  # Keyless signing + checksums (cosign)
  sign:
    name: Sign Release Artifacts
    needs: [validate, build, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail

          rm -rf signatures
          mkdir -p signatures

          cd artifacts

          mapfile -t files < <(
            find . -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.nupkg' \) -print | sort
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "❌ No artifacts found to checksum/sign."
            exit 1
          fi

          : > ../signatures/SHA256SUMS
          for f in "${files[@]}"; do
            sha256sum "$f" | sed 's| \./| |' >> ../signatures/SHA256SUMS
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v4
        with:
          cosign-release: v3.1.3

      - name: Sign artifacts (keyless)
        shell: bash
        run: |
          set -euo pipefail

          cd artifacts

          mapfile -t files < <(
            find . -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.nupkg' \) -print | sort
          )

          for f in "${files[@]}"; do
            outBase="../signatures/${f#./}"
            mkdir -p "$(dirname "$outBase")"

            cosign sign-blob \
              --yes \
              --bundle "${outBase}.sigstore.json" \
              "$f"
          done

          cosign sign-blob \
            --yes \
            --bundle ../signatures/SHA256SUMS.sigstore.json \
            ../signatures/SHA256SUMS

      - name: Upload signatures and checksums
        uses: actions/upload-artifact@v7
        with:
          name: signatures
          path: signatures/**
          retention-days: 7

  # Create GitHub Release with all artifacts
  release:
    name: Create Release
    needs: [validate, build, packages, sign]
    # Only create release on tag push, not manual trigger
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Generate release notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/v${VERSION}"

          cat << EOF > release-notes.md
          ## Downloads

          ### 🚀 Standalone Release (recommended)
          All-in-one binary — just download and run. Perfect for photographers who want
          to focus on their work without worrying about plugin management.

          | Platform | Download |
          |----------|----------|
          | Windows x64 | [revela-win-x64-standalone.zip](${BASE_URL}/revela-win-x64-standalone.zip) |
          | Windows ARM64 | [revela-win-arm64-standalone.zip](${BASE_URL}/revela-win-arm64-standalone.zip) |
          | Linux x64 | [revela-linux-x64-standalone.tar.gz](${BASE_URL}/revela-linux-x64-standalone.tar.gz) |
          | Linux ARM64 | [revela-linux-arm64-standalone.tar.gz](${BASE_URL}/revela-linux-arm64-standalone.tar.gz) |
          | macOS Apple Silicon | [revela-osx-arm64-standalone.tar.gz](${BASE_URL}/revela-osx-arm64-standalone.tar.gz) |

          ### 🎁 Full Release
          For users who want modularity — themes and plugins as separate NuGet packages
          you can update individually or extend with third-party plugins.

          | Platform | Download |
          |----------|----------|
          | Windows x64 | [revela-win-x64-full.zip](${BASE_URL}/revela-win-x64-full.zip) |
          | Windows ARM64 | [revela-win-arm64-full.zip](${BASE_URL}/revela-win-arm64-full.zip) |
          | Linux x64 | [revela-linux-x64-full.tar.gz](${BASE_URL}/revela-linux-x64-full.tar.gz) |
          | Linux ARM64 | [revela-linux-arm64-full.tar.gz](${BASE_URL}/revela-linux-arm64-full.tar.gz) |
          | macOS Apple Silicon | [revela-osx-arm64-full.tar.gz](${BASE_URL}/revela-osx-arm64-full.tar.gz) |

          ### 🧰 Core Release
          Minimal download (~15MB). Designed to install plugins/themes from NuGet.org via
          \`revela plugin install\` — but plugins are not yet published there.

          For now, you'd need to provide plugins via a local NuGet feed or download them
          manually from this release. **Most users want the Standalone or Full release.**

          | Platform | Download |
          |----------|----------|
          | Windows x64 | [revela-win-x64-core.zip](${BASE_URL}/revela-win-x64-core.zip) |
          | Windows ARM64 | [revela-win-arm64-core.zip](${BASE_URL}/revela-win-arm64-core.zip) |
          | Linux x64 | [revela-linux-x64-core.tar.gz](${BASE_URL}/revela-linux-x64-core.tar.gz) |
          | Linux ARM64 | [revela-linux-arm64-core.tar.gz](${BASE_URL}/revela-linux-arm64-core.tar.gz) |
          | macOS Apple Silicon | [revela-osx-arm64-core.tar.gz](${BASE_URL}/revela-osx-arm64-core.tar.gz) |

          ### 🔌 Individual Packages (NuGet)
          For manual installation or existing projects.

          | Package | Description |
          |---------|-------------|
          | [Spectara.Revela.Themes.Lumina.${VERSION}.nupkg](${BASE_URL}/Spectara.Revela.Themes.Lumina.${VERSION}.nupkg) | Default photography theme |
          | [Spectara.Revela.Themes.Lumina.Statistics.${VERSION}.nupkg](${BASE_URL}/Spectara.Revela.Themes.Lumina.Statistics.${VERSION}.nupkg) | Statistics extension for Lumina |
          | [Spectara.Revela.Plugins.Statistics.${VERSION}.nupkg](${BASE_URL}/Spectara.Revela.Plugins.Statistics.${VERSION}.nupkg) | Site statistics generation |
          | [Spectara.Revela.Plugins.Source.OneDrive.${VERSION}.nupkg](${BASE_URL}/Spectara.Revela.Plugins.Source.OneDrive.${VERSION}.nupkg) | OneDrive shared folder source |
          | [Spectara.Revela.Plugins.Calendar.${VERSION}.nupkg](${BASE_URL}/Spectara.Revela.Plugins.Calendar.${VERSION}.nupkg) | Availability calendar |
          | [Spectara.Revela.Plugins.Source.Calendar.${VERSION}.nupkg](${BASE_URL}/Spectara.Revela.Plugins.Source.Calendar.${VERSION}.nupkg) | iCal feed source |
          | [Spectara.Revela.Themes.Lumina.Calendar.${VERSION}.nupkg](${BASE_URL}/Spectara.Revela.Themes.Lumina.Calendar.${VERSION}.nupkg) | Calendar extension for Lumina |
          | [Spectara.Revela.Plugins.Serve.${VERSION}.nupkg](${BASE_URL}/Spectara.Revela.Plugins.Serve.${VERSION}.nupkg) | Local development server |

          ---

          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.validate.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          body_path: release-notes.md
          generate_release_notes: true
          append_body: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.nupkg
            artifacts/**/SHA256SUMS
            artifacts/**/*.sigstore.json

  website:
    name: Publish Website
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-website.yml
    with:
      source-ref: ${{ github.sha }}
      release-tag: ${{ github.ref_name }}
